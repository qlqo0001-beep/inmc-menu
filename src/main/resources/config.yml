# inmc-menu 설정. 게임 안 /메뉴 관리 에서 고치는 것이 편합니다(고치면 이 파일을 다시 씁니다).
# 메뉴의 버튼은 menus/ 에 있고 /메뉴 편집 으로 고칩니다.

# Shift+F 로 메뉴(서버 전체). 끄면 /메뉴 만. 사람마다 끄는 것은 개인 설정.
hotkey: true

# Shift+F 와 /메뉴 가 여는 메뉴
main-menu: main

# "다른 플레이어 숨기기"가 동작하는 월드(스폰 같은 곳). 비우면 어디서도 안 숨깁니다.
hide-players-worlds: []

pack:
  # 리소스팩 화면(팩을 받은 사람에게만). 끄면 모두 일반 아이콘 화면
  enabled: true
  # 그림·글꼴을 써 넣을 곳 — 커스텀아이템이 합치는 팩 소스 폴더(서버 폴더 기준)
  export-to: "plugins/inmc-customitems/pack/sources/40-inmc-menu"

# 랜덤 TP(/야생) 의 서버 전체 한도. 월드마다의 설정(거리·쿨타임·비용 …)은 rtp-worlds.yml — /야생 관리 에서 고치세요.
rtp:
  # 서버 전체에서 동시에 자리를 찾는 수. 넘으면 줄을 섭니다(청크 생성이 겹겹이 쌓이지 않게)
  max-searches: 2
  # 줄 길이. 넘으면 "잠시 뒤에 다시"
  queue-size: 10
  # 평균 틱 시간(ms)이 이걸 넘으면 새 랜덤 TP 를 잠시 받지 않습니다. 0 = 안 봄
  busy-mspt: 45.0
  # 찾기 한 번에 읽어 볼 청크 수 상한. 넘으면 "이번엔 못 찾았습니다"(비용·쿨타임은 안 씀)
  chunk-tries: 8

# 출석(/출석). 출석판은 attendance/ 폴더 — /출석 관리 에서 고치세요.
attendance:
  # 하루를 세는 시간대
  timezone: "Asia/Seoul"
  # 날이 바뀌는 시각(0~23시). 0 = 자정
  reset-hour: 0
  # 수동 출석판을 아직 안 눌렀으면 들어올 때·날이 바뀔 때 알립니다
  remind: true
